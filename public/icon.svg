    <rect x="116" y="116" width="280" height="280" rx="28" fill="#ffffff" />
    
    <!-- Notebook lines -->
    <rect x="156" y="180" width="140" height="12" rx="6" fill="#4f46e5" fill-opacity="0.8" />
    <rect x="156" y="216" width="200" height="10" rx="5" fill="#94a3b8" />
    <rect x="156" y="246" width="170" height="10" rx="5" fill="#94a3b8" />
    <rect x="156" y="276" width="190" height="10" rx="5" fill="#94a3b8" />
    
    <!-- Sync arrows badge -->
    <circle cx="330" cy="330" r="44" fill="#4f46e5" />
    <!-- Sparkle / AI stars -->
    <path d="M330 306 L335 322 L351 327 L335 332 L330 348 L325 332 L309 327 L325 322 Z" fill="#ffffff" />
    <circle cx="354" cy="310" r="4" fill="#a5b4fc" />
